[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-predictor"
version = "0.1.0"
description = "Data collection, storage and Poisson-based prediction for an amateur football league."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
football-predictor = "football_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/football_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
