# MLSZ adatbank: Győr-Moson-Sopron vármegye, felnőtt férfi bajnokságok (Megye I–III).
#
# IDs were read from the adatbank's own league selector. League IDs change every
# season, so each competition lists its ID per season. U21, reserve ("Tartalék"),
# veteran, youth and cup competitions are intentionally left out.
#
# This file contains no personal data and may be committed.

[mlsz]
federation_id = 8                 # Győr-Moson-Sopron
delay_seconds = 3.0               # be polite: at most one request every 3 s
timeout_seconds = 20
max_retries = 3
round_page_max_age_hours = 12     # re-check rounds with pending results after this
user_agent = "football-predictor/0.1 (personal non-commercial research project)"

# Season name -> MLSZ season id. The FIRST entry is the default season.
[mlsz.season_ids]
"2026/27" = 67
"2025/26" = 65

